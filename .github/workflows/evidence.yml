name: evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/verify_evidence.py --output evidence-${{ runner.os }}.json
      - run: python scripts/verify_concurrency.py --output concurrency-${{ runner.os }}.json
      - run: python scripts/verify_soak.py --duration-seconds 5 --output soak-${{ runner.os }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ runner.os }}
          path: |
            evidence-${{ runner.os }}.json
            concurrency-${{ runner.os }}.json
            soak-${{ runner.os }}.json

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/verify_container.py --output container-smoke.json
      - if: always()
        run: |
          if [ -f container-smoke.json ]; then
            echo '## Container smoke evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat container-smoke.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-smoke
          path: container-smoke.json
