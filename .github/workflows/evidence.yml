name: evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/verify_evidence.py --output evidence-${{ runner.os }}.json
      - run: python scripts/verify_concurrency.py --output concurrency-${{ runner.os }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ runner.os }}
          path: |
            evidence-${{ runner.os }}.json
            concurrency-${{ runner.os }}.json
