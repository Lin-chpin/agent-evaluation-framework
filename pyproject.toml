[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation-framework"
version = "0.4.1"
description = "Pluggable Agent evaluation, diagnosis, review, and regression workflow"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
